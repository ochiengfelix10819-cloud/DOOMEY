<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Admin | DOOMEY</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">DOOMEY Admin</a>
      <nav class="nav-links" style="display:flex">
        <a href="admin-verifications.html">Verifications</a>         <a href="#" id="logoutLink">Log Out</a>
      </nav>
    </div>
  </header>

  <main class="container dash-wrap">
    <h2>Advertisement Review</h2>
    <div class="tabs" id="tabs">
      <button type="button" data-status="pending" class="active">Pending</button>
      <button type="button" data-status="approved">Approved</button>
      <button type="button" data-status="rejected">Rejected</button>
    </div>
    <div id="adminMsg" class="message" style="display:none"></div>
    <div class="dash-card" id="adList">Loading...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    var currentStatus = 'pending';

    function note(text, isError) {
      var box = document.getElementById('adminMsg');
      box.textContent = text;
      box.className = 'message ' + (isError ? 'error' : 'success');
      box.style.display = 'block';
    }

    async function guard() {
      var s = await supabaseClient.auth.getSession();
      if (!s.data.session) { window.location.href = 'login.html'; return false; }
      var p = await supabaseClient.from('profiles').select('role').eq('id', s.data.session.user.id).single();
      if (p.error || p.data.role !== 'admin') { window.location.href = 'dashboard.html'; return false; }
      return true;
    }

    async function setStatus(id, status, reason) {
      var r = await supabaseClient
        .from('products')
        .update({ status: status, rejection_reason: reason })
        .eq('id', id);
      if (r.error) { note('Could not update: ' + r.error.message, true); return; }
      note('Advertisement ' + status + '.', false);
      loadAds();
    }

    async function loadAds() {
      var list = document.getElementById('adList');
      list.textContent = 'Loading...';

      var r = await supabaseClient
        .from('products')
        .select('id, fabricator_id, title, description, price_kes, status, rejection_reason, video_url, created_at, product_categories(name), product_images(image_url, sort_order)')
        .eq('status', currentStatus)
        .order('updated_at', { ascending: false });

      if (r.error) { list.textContent = 'Could not load: ' + r.error.message; return; }
      if (r.data.length === 0) { list.textContent = 'No ' + currentStatus + ' advertisements.'; return; }

      var ids = r.data.map(function (p) { return p.fabricator_id; });
      var f = await supabaseClient.from('fabricator_details').select('id, business_name, county, town').in('id', ids);
      var names = {};
      (f.data || []).forEach(function (d) { names[d.id] = d; });

      list.innerHTML = '';
      r.data.forEach(function (p) {
        var row = document.createElement('div');
        row.className = 'ad-row admin-row';

        var imgs = (p.product_images || []).sort(function (a, b) { return a.sort_order - b.sort_order; });
        var gallery = document.createElement('div');
        gallery.className = 'admin-gallery';
        imgs.forEach(function (i) {
          var a = document.createElement('a');
          a.href = i.image_url; a.target = '_blank'; a.rel = 'noopener';
          var im = document.createElement('img');
          im.src = i.image_url; im.alt = '';
          a.appendChild(im);
          gallery.appendChild(a);
        });

        var info = document.createElement('div');
        info.className = 'ad-info';
        var fab = names[p.fabricator_id];
        var t = document.createElement('strong'); t.textContent = p.title;
        var meta = document.createElement('div');
        meta.textContent = (p.product_categories ? p.product_categories.name : '') + ' | KES ' + Number(p.price_kes).toLocaleString();
        var by = document.createElement('div');
        by.className = 'auth-sub';
        by.style.margin = '2px 0';
        by.textContent = 'By ' + (fab ? fab.business_name + ' (' + fab.town + ', ' + fab.county + ')' : 'Unknown');
        var desc = document.createElement('p');
        desc.textContent = p.description || '';
        info.appendChild(t); info.appendChild(meta); info.appendChild(by); info.appendChild(desc);

        if (p.video_url) {
          var v = document.createElement('a');
          v.href = p.video_url; v.target = '_blank'; v.rel = 'noopener';
          v.textContent = 'Watch video';
          v.style.color = 'var(--copper)';
          info.appendChild(v);
        }
        if (p.status === 'rejected' && p.rejection_reason) {
          var rn = document.createElement('div');
          rn.className = 'reject-note';
          rn.textContent = 'Reason: ' + p.rejection_reason;
          info.appendChild(rn);
        }

        var actions = document.createElement('div');
        actions.className = 'ad-actions';
        if (p.status !== 'approved') {
          var ok = document.createElement('button');
          ok.type = 'button'; ok.textContent = 'Approve';
          ok.addEventListener('click', function () { setStatus(p.id, 'approved', null); });
          actions.appendChild(ok);
        }
        if (p.status !== 'rejected') {
          var no = document.createElement('button');
          no.type = 'button'; no.className = 'danger';
          no.textContent = p.status === 'approved' ? 'Unpublish' : 'Reject';
          no.addEventListener('click', function () {
            var reason = prompt('Reason shown to the fabricator (required):');
            if (!reason || reason.trim().length < 3) { note('A reason is required.', true); return; }
            setStatus(p.id, 'rejected', reason.trim());
          });
          actions.appendChild(no);
        }

        row.appendChild(gallery);
        row.appendChild(info);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    document.getElementById('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      currentStatus = b.getAttribute('data-status');
      Array.from(this.children).forEach(function (c) { c.classList.toggle('active', c === b); });
      document.getElementById('adminMsg').style.display = 'none';
      loadAds();
    });

    document.getElementById('logoutLink').addEventListener('click', function (e) {
      e.preventDefault();
      logoutUser();
    });

    guard().then(function (ok) { if (ok) loadAds(); });
  </script>
</body>
</html>
