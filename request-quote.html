<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quotation | DOOMEY</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">DOOMEY</a>
      <nav class="nav-links" style="display:flex">
        <a href="my-quotations.html">My Quotations</a>
        <a href="explore.html">Products</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card wide">
      <h2>Request a Quotation</h2>
      <div id="summary" class="dash-card" style="margin:12px 0">Loading...</div>
      <div id="message" class="message" style="display:none"></div>

      <form id="quoteForm" style="display:none">
        <label for="title">What do you need? *</label>
        <input type="text" id="title" maxlength="100" placeholder="e.g. Double gate with side panel" required>

        <label for="category">Category *</label>
        <select id="category" required></select>

        <label for="description">Describe the job *</label>
        <textarea id="description" rows="4" maxlength="1500" placeholder="Design, materials, finish, colour, deadline..." required></textarea>

        <label for="measurements">Measurements (optional)</label>
        <textarea id="measurements" rows="2" maxlength="500" placeholder="e.g. 3 m wide x 2 m high"></textarea>

        <label for="location">Site location *</label>
        <input type="text" id="location" maxlength="200" placeholder="Town, estate, landmark" required>

        <label for="phone">Your phone number *</label>
        <input type="tel" id="phone" placeholder="0712345678" required>

        <label for="budget">Your budget in KES (optional)</label>
        <input type="number" id="budget" min="0" max="100000000" step="1">

        <label>Reference pictures (optional, up to 4)</label>
        <div id="photoGrid" class="photo-grid"></div>
        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" multiple>

        <p class="auth-sub" style="margin-top:14px">
          The fabricator replies with a price. Nothing is agreed until you accept the quote.
          Payment is made directly to the fabricator.
        </p>

        <button type="submit" class="btn" id="saveBtn">Send Request</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    var MAX_PHOTOS = 4;
    var userId = null;
    var fabricatorId = new URLSearchParams(window.location.search).get('fabricator');
    var photos = [];

    function validKenyanPhone(v) {
      return /^(\+254|0)[17]\d{8}$/.test(v.replace(/\s/g, ''));
    }

    function compressImage(file) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          var scale = Math.min(1, 1280 / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          canvas.toBlob(function (blob) {
            if (blob) resolve(blob); else reject(new Error('Could not process ' + file.name));
          }, 'image/jpeg', 0.8);
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
        img.src = url;
      });
    }

    function renderPhotos() {
      var grid = document.getElementById('photoGrid');
      grid.innerHTML = '';
      photos.forEach(function (p, index) {
        var box = document.createElement('div');
        box.className = 'thumb';
        var im = document.createElement('img');
        im.src = p.preview; im.alt = 'Reference picture';
        var btn = document.createElement('button');
        btn.type = 'button'; btn.textContent = '\u00d7';
        btn.setAttribute('aria-label', 'Remove picture');
        btn.addEventListener('click', function () {
          URL.revokeObjectURL(p.preview);
          photos.splice(index, 1);
          renderPhotos();
        });
        box.appendChild(im); box.appendChild(btn);
        grid.appendChild(box);
      });
    }

    document.getElementById('photoInput').addEventListener('change', async function (e) {
      var files = Array.from(e.target.files);
      e.target.value = '';
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        if (photos.length >= MAX_PHOTOS) { showMessage('You can add up to ' + MAX_PHOTOS + ' pictures.', true); break; }
        if (['image/jpeg', 'image/png', 'image/webp'].indexOf(f.type) === -1) { showMessage(f.name + ' is not a JPG, PNG or WebP image.', true); continue; }
        if (f.size > 15 * 1024 * 1024) { showMessage(f.name + ' is too large (max 15 MB).', true); continue; }
        try {
          var blob = await compressImage(f);
          photos.push({ blob: blob, preview: URL.createObjectURL(blob) });
        } catch (err) { showMessage(err.message, true); }
      }
      renderPhotos();
    });

    async function init() {
      var summary = document.getElementById('summary');
      var s = await supabaseClient.auth.getSession();
      if (!s.data.session) { window.location.href = 'login.html'; return; }
      userId = s.data.session.user.id;

      var prof = await supabaseClient.from('profiles').select('role, phone').eq('id', userId).single();
      if (prof.error) { summary.textContent = 'Could not load your account.'; return; }
      if (prof.data.role !== 'customer') {
        summary.textContent = 'Only customer accounts can request quotations. Please log in with a customer account.';
        return;
      }
      if (prof.data.phone) document.getElementById('phone').value = prof.data.phone;

      if (!fabricatorId) { summary.textContent = 'No fabricator selected.'; return; }
      var f = await supabaseClient.from('fabricator_details')
        .select('business_name, town, county').eq('id', fabricatorId).maybeSingle();
      if (f.error || !f.data || !f.data.business_name) { summary.textContent = 'This fabricator was not found.'; return; }

      summary.innerHTML = '';
      var t = document.createElement('strong'); t.textContent = f.data.business_name;
      var l = document.createElement('div'); l.className = 'auth-sub';
      l.textContent = f.data.town + ', ' + f.data.county;
      summary.appendChild(t); summary.appendChild(l);

      var sel = document.getElementById('category');
      var first = document.createElement('option');
      first.value = ''; first.textContent = 'Select category';
      sel.appendChild(first);
      var cats = await supabaseClient.from('product_categories').select('id, name').order('id');
      (cats.data || []).forEach(function (c) {
        var o = document.createElement('option');
        o.value = c.id; o.textContent = c.name;
        sel.appendChild(o);
      });
      document.getElementById('quoteForm').style.display = 'block';
    }

    document.getElementById('quoteForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('saveBtn');

      var title = document.getElementById('title').value.trim();
      var categoryId = parseInt(document.getElementById('category').value, 10);
      var description = document.getElementById('description').value.trim();
      var location = document.getElementById('location').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var budgetRaw = document.getElementById('budget').value;
      var budget = budgetRaw === '' ? null : parseFloat(budgetRaw);

      if (title.length < 3) { showMessage('Please say what you need.', true); return; }
      if (!categoryId) { showMessage('Please choose a category.', true); return; }
      if (description.length < 10) { showMessage('Please describe the job (at least 10 characters).', true); return; }
      if (location.length < 3) { showMessage('Please enter the site location.', true); return; }
      if (!validKenyanPhone(phone)) { showMessage('Enter a valid Kenyan phone number, e.g. 0712345678.', true); return; }
      if (budget !== null && (isNaN(budget) || budget < 0)) { showMessage('Budget must be a valid amount.', true); return; }

      setLoading(btn, true, 'Send Request');

      var quoteId = crypto.randomUUID();
      var paths = [];
      for (var i = 0; i < photos.length; i++) {
        var path = userId + '/' + quoteId + '/' + Date.now() + '-' + i + '.jpg';
        var up = await supabaseClient.storage.from('quotation-refs').upload(path, photos[i].blob, { contentType: 'image/jpeg' });
        if (up.error) { setLoading(btn, false, 'Send Request'); showMessage('Picture upload failed: ' + up.error.message, true); return; }
        paths.push(path);
      }

      var r = await supabaseClient.from('quotations').insert({
        id: quoteId,
        fabricator_id: fabricatorId,
        category_id: categoryId,
        title: title,
        description: description,
        measurements: document.getElementById('measurements').value.trim() || null,
        customer_phone: phone.replace(/\s/g, ''),
        location: location,
        budget_kes: budget,
        reference_paths: paths
      });
      setLoading(btn, false, 'Send Request');

      if (r.error) { showMessage('Could not send request: ' + r.error.message, true); return; }
      showMessage('Request sent! Redirecting...', false);
      setTimeout(function () { window.location.href = 'my-quotations.html'; }, 1200);
    });

    init();
  </script>
</body>
</html>
