<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DOOMEY</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">DOOMEY</a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-sub">Log in to your DOOMEY account.</p>
      <div id="message" class="message" style="display:none"></div>
      <form id="authForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button type="submit" class="btn">Log In</button>
      </form>
      <p class="auth-switch">New here? <a href="register-customer.html">Register as a Customer</a></p>
      <p class="auth-switch">Welder? <a href="register-fabricator.html">Register as a Fabricator</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('authForm').addEventListener('submit', function (e) {
      e.preventDefault();
      loginUser();
    });
  </script>
</body>
</html>
