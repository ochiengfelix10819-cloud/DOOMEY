<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | DOOMEY</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">DOOMEY</a>
      <nav class="nav-links" style="display:flex">
        <a href="dashboard.html">Dashboard</a>
        <a href="explore.html">Products</a>
        <a href="#" id="logoutLink">Log Out</a>
      </nav>
    </div>
  </header>

  <main class="container dash-wrap">
    <h2 id="pageTitle">My Orders</h2>
    <div id="notifBox" class="dash-card" style="display:none;margin:14px 0"></div>
    <div id="adminMsg" class="message" style="display:none"></div>
    <p class="auth-sub">Payments are made directly between customer and fabricator. DOOMEY does not hold payments. A payment counts as received only after the fabricator confirms it.</p>
    <div class="dash-card" id="list">Loading...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    var uid = null, role = null;
    var STATUS = { pending: 'Pending', accepted: 'Accepted', in_progress: 'In Progress', completed: 'Completed', cancelled: 'Cancelled' };
    var PAY = { mpesa: 'M-Pesa', cash: 'Cash', bank_transfer: 'Bank transfer' };
    var PSTATUS = { reported: 'Reported, awaiting confirmation', confirmed: 'Confirmed by fabricator', not_received: 'Marked as not received' };
    var FLOW = ['pending', 'accepted', 'in_progress', 'completed'];
    var NEXT = {
      pending: [['accepted', 'Accept']],
      accepted: [['in_progress', 'Start work']],
      in_progress: [['completed', 'Mark completed']]
    };

    function money(n) { return 'KES ' + Number(n).toLocaleString(); }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function note(text, isError) {
      var b = document.getElementById('adminMsg');
      b.textContent = text;
      b.className = 'message ' + (isError ? 'error' : 'success');
      b.style.display = 'block';
      window.scrollTo(0, 0);
    }

    function line(parent, text) {
      parent.appendChild(el('div', '', text));
    }

    async function changeStatus(id, status) {
      var r = await supabaseClient.from('orders').update({ status: status }).eq('id', id);
      if (r.error) { note('Could not update: ' + r.error.message, true); return; }
      note('Order updated.', false);
      loadOrders();
    }

    async function changePayment(id, status) {
      var r = await supabaseClient.from('payment_records').update({ status: status }).eq('id', id);
      if (r.error) { note('Could not update payment: ' + r.error.message, true); return; }
      note(status === 'confirmed' ? 'Payment confirmed.' : 'Payment marked as not received.', false);
      loadOrders();
    }

    function validKnownMpesa(v) { return /^[A-Z0-9]{10}$/.test(v); }

    function buildPayForm(o, outstanding) {
      var form = el('form', 'pay-form');
      form.innerHTML =
        '<label>Amount paid (KES) *</label><input type="number" class="pf-amount" min="1" step="1" required>' +
        '<label>Payment method *</label><select class="pf-method">' +
          '<option value="mpesa">M-Pesa</option><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option></select>' +
        '<label class="pf-ref-label">M-Pesa confirmation code *</label><input type="text" class="pf-ref" maxlength="40" placeholder="e.g. QGH7ABC123">' +
        '<label>Note (optional)</label><input type="text" class="pf-note" maxlength="200">' +
        '<button type="submit" class="btn pf-submit"></button>';

      var amount = form.querySelector('.pf-amount');
      var method = form.querySelector('.pf-method');
      var ref = form.querySelector('.pf-ref');
      var refLabel = form.querySelector('.pf-ref-label');
      var submit = form.querySelector('.pf-submit');
      var label = (role === 'fabricator') ? 'Record Payment Received' : 'Report Payment';
      submit.textContent = label;
      method.value = o.payment_method;
      if (outstanding > 0) amount.value = Math.round(outstanding);

      function syncMethod() {
        if (method.value === 'cash') {
          ref.style.display = 'none'; refLabel.style.display = 'none';
        } else {
          ref.style.display = 'block'; refLabel.style.display = 'block';
          refLabel.textContent = method.value === 'mpesa' ? 'M-Pesa confirmation code *' : 'Bank transfer reference *';
          ref.placeholder = method.value === 'mpesa' ? 'e.g. QGH7ABC123' : 'Reference from your bank';
        }
      }
      method.addEventListener('change', syncMethod);
      syncMethod();

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var amt = parseFloat(amount.value);
        var m = method.value;
        var r = ref.value.trim().toUpperCase();
        if (isNaN(amt) || amt <= 0) { note('Enter a valid amount.', true); return; }
        if (m === 'mpesa' && !validKnownMpesa(r)) { note('Enter the 10-character M-Pesa confirmation code, e.g. QGH7ABC123.', true); return; }
        if (m === 'bank_transfer' && r.length < 4) { note('Enter the bank transfer reference.', true); return; }

        submit.disabled = true;
        submit.textContent = 'Please wait...';
        var res = await supabaseClient.from('payment_records').insert({
          order_id: o.id,
          amount_kes: amt,
          method: m,
          reference: (m === 'cash') ? null : r,
          note: form.querySelector('.pf-note').value.trim() || null,
          recorded_by: uid
        });
        submit.disabled = false;
        submit.textContent = label;
        if (res.error) {
          var msg = res.error.message || '';
          if (msg.toLowerCase().indexOf('duplicate') !== -1) msg = 'That M-Pesa code is already used on another payment record.';
          note('Could not save payment: ' + msg, true);
          return;
        }
        note(role === 'fabricator' ? 'Payment recorded as received.' : 'Payment reported. The fabricator will confirm it.', false);
        loadOrders();
      });
      return form;
    }

    function renderPayments(o, pays, info) {
      var total = Number(o.unit_price_kes) * o.quantity;
      var confirmed = 0, pending = 0;
      pays.forEach(function (p) {
        if (p.status === 'confirmed') confirmed += Number(p.amount_kes);
        else if (p.status === 'reported') pending += Number(p.amount_kes);
      });

      var box = el('div', 'pay-box');
      box.appendChild(el('strong', '', 'Payment'));
      line(box, 'Order total: ' + money(total) + ' (final price is agreed with the fabricator)');
      line(box, 'Confirmed as received: ' + money(confirmed));
      if (pending > 0) line(box, 'Reported, not yet confirmed: ' + money(pending));
      if (total > 0 && confirmed >= total) line(box, 'Fully paid (confirmed by the fabricator)');

      pays.forEach(function (p) {
        var rec = el('div', 'pay-record');
        var who = (p.recorded_by === o.customer_id) ? 'Reported by customer' : 'Recorded by fabricator';
        line(rec, money(p.amount_kes) + ' | ' + PAY[p.method] + (p.reference ? ' | ' + p.reference : ''));
        line(rec, who + ' | ' + new Date(p.created_at).toLocaleString());
        if (p.note) line(rec, 'Note: ' + p.note);
        rec.appendChild(el('span', 'status-tag status-' + p.status, PSTATUS[p.status]));

        if (role === 'fabricator' && p.status !== 'confirmed') {
          var acts = el('div', 'ad-actions');
          acts.style.marginTop = '6px';
          var ok = el('button', '', 'Confirm received');
          ok.type = 'button';
          ok.addEventListener('click', function () {
            if (confirm('Confirm that you received ' + money(p.amount_kes) + '?')) changePayment(p.id, 'confirmed');
          });
          acts.appendChild(ok);
          if (p.status === 'reported') {
            var no = el('button', 'danger', 'Not received');
            no.type = 'button';
            no.addEventListener('click', function () {
              if (confirm('Mark this payment as NOT received?')) changePayment(p.id, 'not_received');
            });
            acts.appendChild(no);
          }
          rec.appendChild(acts);
        }
        box.appendChild(rec);
      });

      var canPay = ['accepted', 'in_progress', 'completed'].indexOf(o.status) !== -1;
      if (canPay) {
        var form = buildPayForm(o, total - confirmed - pending);
        var toggle = el('button', 'btn btn-outline', role === 'fabricator' ? 'Record a payment received' : 'Report a payment');
        toggle.type = 'button';
        toggle.style.marginTop = '10px';
        toggle.addEventListener('click', function () {
          form.style.display = (form.style.display === 'block') ? 'none' : 'block';
        });
        box.appendChild(toggle);
        box.appendChild(form);
      } else if (o.status === 'pending') {
        box.appendChild(el('p', 'auth-sub', 'Payments can be recorded once the fabricator accepts the order.'));
      }
      info.appendChild(box);
    }

    function renderTracker(o, info) {
      if (o.status === 'cancelled') return;
      var idx = FLOW.indexOf(o.status);
      var t = el('div', 'tracker');
      FLOW.forEach(function (s, i) {
        t.appendChild(el('div', 'track-step' + (i <= idx ? ' done' : ''), STATUS[s]));
      });
      info.appendChild(t);
    }

    async function loadNotifications() {
      var r = await supabaseClient.from('notifications')
        .select('id, message, is_read, created_at')
        .order('created_at', { ascending: false }).limit(8);
      if (r.error || !r.data.length) return;

      var box = document.getElementById('notifBox');
      box.innerHTML = '';
      box.appendChild(el('h3', '', 'Notifications'));
      r.data.forEach(function (n) {
        var d = el('div', '', (n.is_read ? '' : '\u25CF ') + n.message + '  (' + new Date(n.created_at).toLocaleString() + ')');
        d.style.padding = '6px 0';
        if (!n.is_read) d.style.fontWeight = 'bold';
        box.appendChild(d);
      });
      box.style.display = 'block';

      await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', uid).eq('is_read', false);
    }

    async function loadOrders() {
      var list = document.getElementById('list');
      list.textContent = 'Loading...';

      var q = supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
      q = (role === 'fabricator') ? q.eq('fabricator_id', uid) : q.eq('customer_id', uid);
      var r = await q;
      if (r.error) { list.textContent = 'Could not load orders: ' + r.error.message; return; }
      if (!r.data.length) {
        list.innerHTML = role === 'fabricator'
          ? '<div class="empty-state"><div class="empty-icon">\uD83D\uDCE6</div><h3>No orders yet</h3><p>New customer orders will appear here.</p></div>'
          : '<div class="empty-state"><div class="empty-icon">\uD83D\uDCE6</div><h3>No orders yet</h3><p>When you order a product, you can track it here.</p><a href="explore.html" class="btn">Browse products</a></div>';
        return;
      }

      var orderIds = r.data.map(function (o) { return o.id; });
      var pr = await supabaseClient.from('payment_records').select('*')
        .in('order_id', orderIds).order('created_at', { ascending: true });
      var payMap = {};
      (pr.data || []).forEach(function (p) {
        if (!payMap[p.order_id]) payMap[p.order_id] = [];
        payMap[p.order_id].push(p);
      });

      var fabNames = {};
      if (role === 'customer') {
        var ids = r.data.map(function (o) { return o.fabricator_id; });
        var f = await supabaseClient.from('fabricator_details').select('id, business_name').in('id', ids);
        (f.data || []).forEach(function (d) { fabNames[d.id] = d.business_name; });
      }

      list.innerHTML = '';
      r.data.forEach(function (o) {
        var row = el('div', 'ad-row admin-row');
        var info = el('div', 'ad-info');
        info.appendChild(el('strong', '', o.product_title + ' x ' + o.quantity));
        line(info, 'Total: ' + money(Number(o.unit_price_kes) * o.quantity));
        line(info, 'Preferred payment method: ' + PAY[o.payment_method]);
        line(info, 'Location: ' + o.delivery_location);
        if (role === 'fabricator') {
          line(info, 'Customer: ' + (o.customer_name || '-'));
          var ph = el('div');
          ph.appendChild(document.createTextNode('Phone: '));
          var a = el('a', '', o.customer_phone);
          a.href = 'tel:' + o.customer_phone;
          a.style.color = 'var(--copper)';
          ph.appendChild(a);
          info.appendChild(ph);
        } else {
          line(info, 'Fabricator: ' + (fabNames[o.fabricator_id] || '-'));
        }
        if (o.notes) line(info, 'Notes: ' + o.notes);
        line(info, 'Ordered: ' + new Date(o.created_at).toLocaleString());
        info.appendChild(el('span', 'status-tag status-' + o.status, STATUS[o.status]));
        renderTracker(o, info);
        renderPayments(o, payMap[o.id] || [], info);

        var actions = el('div', 'ad-actions');
        if (role === 'fabricator') {
          (NEXT[o.status] || []).forEach(function (n) {
            var b = el('button', '', n[1]);
            b.type = 'button';
            b.addEventListener('click', function () { changeStatus(o.id, n[0]); });
            actions.appendChild(b);
          });
          if (o.status === 'pending' || o.status === 'accepted' || o.status === 'in_progress') {
            var c = el('button', 'danger', o.status === 'pending' ? 'Decline' : 'Cancel');
            c.type = 'button';
            c.addEventListener('click', function () {
              if (confirm('Cancel this order?')) changeStatus(o.id, 'cancelled');
            });
            actions.appendChild(c);
          }
        } else if (o.status === 'pending') {
          var cc = el('button', 'danger', 'Cancel order');
          cc.type = 'button';
          cc.addEventListener('click', function () {
            if (confirm('Cancel this order?')) changeStatus(o.id, 'cancelled');
          });
          actions.appendChild(cc);
        }

        row.appendChild(info);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    async function init() {
      var s = await supabaseClient.auth.getSession();
      if (!s.data.session) { window.location.href = 'login.html'; return; }
      uid = s.data.session.user.id;
      var p = await supabaseClient.from('profiles').select('role').eq('id', uid).single();
      if (p.error) { document.getElementById('list').textContent = 'Could not load your account.'; return; }
      role = p.data.role;
      if (role === 'admin') { window.location.href = 'admin.html'; return; }
      if (role === 'fabricator') document.getElementById('pageTitle').textContent = 'Incoming Orders';
      await loadNotifications();
      loadOrders();
    }

    document.getElementById('logoutLink').addEventListener('click', function (e) {
      e.preventDefault();
      logoutUser();
    });

    init();
  </script>
</body>
</html>
