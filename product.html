<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | DOOMEY</title>
   <meta name="description" content="View product photos, price and fabricator details on DOOMEY.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DOOMEY">
  <meta property="og:title" content="Product | DOOMEY">
  <meta property="og:description" content="View product photos, price and fabricator details on DOOMEY.">
  <meta property="og:url" content="https://doomey.vercel.app/product.html">
  <meta property="og:image" content="https://doomey.vercel.app/images/categories/gates-and-doors.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <!-- Google tag (analytics) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TM8W4DLB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">DOOMEY</a>
      <nav class="nav-links" style="display:flex">
        <a href="explore.html">Products</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container dash-wrap">
    <h1 class="sr-only">Product details</h1>
    <p><a href="explore.html" style="color:var(--copper)">&larr; Back to products</a></p>
    <div id="content"><div class="dm-loader" role="status"><span class="dm-arc" aria-hidden="true"></span><span class="dm-loader-text">Loading...</span></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="seo.js"></script>
  <script src="share.js"></script>
  <script src="lightbox.js"></script>
  <script src="supabase-config.js"></script>   <script src="contact.js"></script>
  <script>
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    async function load() {
      var content = document.getElementById('content');
      var id = new URLSearchParams(window.location.search).get('id');
      if (!id) { content.textContent = 'No product selected.'; return; }

      var r = await supabaseClient
        .from('products')
        .select('*, product_categories(name), product_images(image_url, sort_order)')
        .eq('id', id)
        .eq('status', 'approved')
        .maybeSingle();

      if (r.error || !r.data) { content.textContent = 'This product is not available.'; return; }
      var p = r.data;
      document.title = p.title + ' | DOOMEY';

      var f = await supabaseClient.from('fabricator_details')
        .select('id, business_name, town, county, area, workshop_address, experience_years, is_verified')
        .eq('id', p.fabricator_id).maybeSingle();
      var fab = f.data;

      var imgs = (p.product_images || []).sort(function (a, b) { return a.sort_order - b.sort_order; });

      // Canonical address and structured data for search engines
      var pageUrl = window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(p.id);
      dmSetSeo({
        url: pageUrl,
        title: p.title + ' | DOOMEY',
        description: p.title + ' - KES ' + Number(p.price_kes).toLocaleString() + '. ' + (p.description || ''),
        jsonld: {
          '@context': 'https://schema.org',
          '@type': 'Product',
          name: p.title,
          description: p.description || p.title,
          image: imgs.map(function (i) { return i.image_url; }),
          category: p.product_categories ? p.product_categories.name : undefined,
          url: pageUrl,
          offers: {
            '@type': 'Offer',
            priceCurrency: 'KES',
            price: String(p.price_kes),
            url: pageUrl,
            seller: fab ? { '@type': 'Organization', name: fab.business_name } : undefined
          }
        }
      });

      content.innerHTML = '';
      var wrap = el('div', 'product-layout');

      // Gallery
      var gallery = el('div', 'gallery');
      var main = el('img', 'gallery-main');
      main.alt = p.title;
      var current = 0;
      var urlList = imgs.map(function (i) { return i.image_url; });
      if (imgs.length) {
        main.src = urlList[0];
        main.classList.add('zoomable');
        main.tabIndex = 0;
        main.setAttribute('role', 'button');
        main.setAttribute('aria-label', 'Enlarge photo of ' + p.title);
        main.addEventListener('click', function () { dmLightbox(urlList, current, p.title); });
        main.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dmLightbox(urlList, current, p.title); } });
      }
      gallery.appendChild(main);
      if (imgs.length > 1) {
        var thumbs = el('div', 'gallery-thumbs');
        imgs.forEach(function (i, n) {
          var t = el('img');
          t.src = i.image_url; t.alt = 'Show photo ' + (n + 1) + ' of ' + p.title;
          t.loading = 'lazy';
          t.tabIndex = 0;
          t.setAttribute('role', 'button');
          function pick() { current = n; main.src = i.image_url; }
          t.addEventListener('click', pick);
          t.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
          thumbs.appendChild(t);
        });
        gallery.appendChild(thumbs);
      }
      if (p.video_url) {
        var v = document.createElement('video');
        v.src = p.video_url; v.controls = true; v.preload = 'metadata';
        v.className = 'gallery-video';
        gallery.appendChild(v);
      }

      // Details
      var info = el('div', 'product-info');
      info.appendChild(el('h2', '', p.title));
      info.appendChild(el('div', 'price', 'KES ' + Number(p.price_kes).toLocaleString()));
      info.appendChild(el('p', 'auth-sub', p.product_categories ? p.product_categories.name : ''));
      info.appendChild(el('p', '', p.description || ''));

      if (fab) {
        var fc = el('div', 'dash-card');
        fc.style.marginTop = '20px';
        fc.appendChild(el('h3', '', 'Sold by'));
        var nameLink = el('a', '', fab.business_name);         nameLink.href = 'fabricator.html?id=' + fab.id;         nameLink.style.fontWeight = 'bold';         nameLink.style.color = 'var(--copper)';         fc.appendChild(nameLink);
        if (fab.is_verified) {
          var b = el('span', 'badge', '\u2714 VERIFIED');
          b.style.marginLeft = '8px';
          fc.appendChild(b);
        }
        fc.appendChild(el('p', '', fab.area + ', ' + fab.town + ', ' + fab.county + ' County'));
        fc.appendChild(el('p', '', 'Workshop: ' + fab.workshop_address));
        fc.appendChild(el('p', '', fab.experience_years + ' years of experience'));
        var orderBtn = el('a', 'btn', 'Order This Product');         orderBtn.href = 'order.html?product=' + p.id;         orderBtn.style.marginTop = '12px';         fc.appendChild(orderBtn);         var quoteBtn = el('a', 'btn btn-outline', 'Request a Quotation');         quoteBtn.href = 'request-quote.html?fabricator=' + fab.id;         quoteBtn.style.margin = '12px 0 0 8px';         fc.appendChild(quoteBtn);         addContactButtons(fc, fab.id);        
      }

      dmAddShare(info, p.title);
      wrap.appendChild(gallery);
      wrap.appendChild(info);
      content.appendChild(wrap);
    }
    load();
  </script>
  <script src="bot.js"></script>
</body>
</html>
