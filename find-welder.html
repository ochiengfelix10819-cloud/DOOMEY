<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Welder Near You | DOOMEY</title>
   <meta name="description" content="Search welders and fabricators by county and town and see their workshops on a map.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DOOMEY">
  <meta property="og:title" content="Find a Welder Near You | DOOMEY">
  <meta property="og:description" content="Search welders and fabricators by county and town and see their workshops on a map.">
  <meta property="og:url" content="https://doomey.vercel.app/find-welder.html">
  <link rel="canonical" href="https://doomey.vercel.app/find-welder.html">
  <meta property="og:image" content="https://doomey.vercel.app/images/categories/gates-and-doors.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Google tag (analytics) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TM8W4DLB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">DOOMEY</a>
      <nav class="nav-links" style="display:flex">
        <a href="explore.html">Products</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container dash-wrap">
    <h1 class="page-title">Find a Welder</h1>

    <form id="filters" class="fab-filter">
      <input type="text" id="q" aria-label="Search by name or skill" placeholder="Search by name or skill...">
      <select id="county" aria-label="County"></select>
      <input type="text" id="town" aria-label="Town" placeholder="Town">
      <button type="submit" class="btn">Search</button>
      <button type="button" class="btn btn-outline" id="nearBtn">Near me</button>
    </form>

    <p id="count" class="auth-sub"></p>
    <div id="map" class="map-box tall"></div>
    <div id="grid" class="grid-3"><div class="dm-loader" role="status"><span class="dm-arc" aria-hidden="true"></span><span class="dm-loader-text">Loading...</span></div></div>
  </main>
  <div id="siteFooter"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="supabase-config.js"></script>
  <script>
    var COUNTIES = ['Baringo','Bomet','Bungoma','Busia','Elgeyo-Marakwet','Embu','Garissa','Homa Bay','Isiolo','Kajiado','Kakamega','Kericho','Kiambu','Kilifi','Kirinyaga','Kisii','Kisumu','Kitui','Kwale','Laikipia','Lamu','Machakos','Makueni','Mandera','Marsabit','Meru','Migori','Mombasa','Murang\'a','Nairobi','Nakuru','Nandi','Narok','Nyamira','Nyandarua','Nyeri','Samburu','Siaya','Taita-Taveta','Tana River','Tharaka-Nithi','Trans Nzoia','Turkana','Uasin Gishu','Vihiga','Wajir','West Pokot'];

    var map = L.map('map').setView([0.0236, 37.9062], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    var markers = L.layerGroup().addTo(map);
    var userPos = null;

    var sel = document.getElementById('county');
    var all = document.createElement('option');
    all.value = ''; all.textContent = 'All counties';
    sel.appendChild(all);
    COUNTIES.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });

    function distanceKm(lat1, lon1, lat2, lon2) {
      var R = 6371, rad = Math.PI / 180;
      var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Escape text before putting it in a map popup
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    async function load() {
      var grid = document.getElementById('grid');
      grid.innerHTML = '<div class="dm-loader" role="status"><span class="dm-arc" aria-hidden="true"></span><span class="dm-loader-text">Loading...</span></div>';

      var q = document.getElementById('q').value.trim().replace(/[,()%]/g, ' ');
      var county = document.getElementById('county').value;
      var town = document.getElementById('town').value.trim();

      var query = supabaseClient.from('fabricator_details')
        .select('id, business_name, skills, county, town, area, experience_years, is_verified, latitude, longitude')
        .not('business_name', 'is', null);

      if (q) query = query.or('business_name.ilike.%' + q + '%,skills.ilike.%' + q + '%');
      if (county) query = query.eq('county', county);
      if (town) query = query.ilike('town', '%' + town.replace(/[,()%]/g, ' ') + '%');

      var r = await query.limit(100);
      if (r.error) { grid.textContent = 'Could not load: ' + dmErr(r.error); return; }

      var list = r.data;
      if (userPos) {
        list.forEach(function (f) {
          f.dist = (f.latitude != null) ? distanceKm(userPos.lat, userPos.lng, f.latitude, f.longitude) : 99999;
        });
        list.sort(function (a, b) { return a.dist - b.dist; });
      } else {
        list.sort(function (a, b) { return (b.is_verified ? 1 : 0) - (a.is_verified ? 1 : 0); });
      }
      render(list);
    }

    function render(list) {
      var grid = document.getElementById('grid');
      grid.innerHTML = '';
      markers.clearLayers();
      document.getElementById('count').textContent =
        list.length + (list.length === 1 ? ' fabricator found' : ' fabricators found');
      if (list.length === 0) { grid.innerHTML = '<div class="empty-state"><div class="empty-icon">\uD83D\uDC77</div><h3>No fabricators found</h3><p>Try another county or town, or clear the search.</p><a href="find-welder.html" class="btn">Clear filters</a></div>'; return; }

      var points = [];
      list.forEach(function (f) {
        var card = document.createElement('a');
        card.className = 'card fab-card';
        card.href = 'fabricator.html?id=' + f.id;
        var h = document.createElement('h3'); h.textContent = f.business_name;
        var loc = document.createElement('p');
        loc.textContent = f.area + ', ' + f.town + ', ' + f.county;
        var exp = document.createElement('p');
        exp.textContent = f.experience_years + ' years of experience';
        card.appendChild(h); card.appendChild(loc); card.appendChild(exp);
        if (f.dist != null && f.dist < 99999) {
          var d = document.createElement('p');
          d.textContent = f.dist.toFixed(1) + ' km away';
          card.appendChild(d);
        }
        if (f.is_verified) {
          var b = document.createElement('span');
          b.className = 'badge'; b.textContent = '\u2714 VERIFIED';
          card.appendChild(b);
        }
        grid.appendChild(card);

        if (f.latitude != null && f.longitude != null) {
          var m = L.marker([f.latitude, f.longitude]).addTo(markers);
          m.bindPopup('<strong>' + esc(f.business_name) + '</strong><br>' + esc(f.town) + ', ' + esc(f.county) +
            '<br><a href="fabricator.html?id=' + encodeURIComponent(f.id) + '">View profile</a>');
          points.push([f.latitude, f.longitude]);
        }
      });
      if (points.length === 1) map.setView(points[0], 13);
      else if (points.length > 1) map.fitBounds(points, { padding: [30, 30] });
    }

    document.getElementById('filters').addEventListener('submit', function (e) {
      e.preventDefault();
      load();
    });

    document.getElementById('nearBtn').addEventListener('click', function () {
      if (!navigator.geolocation) { alert('Your browser does not support location.'); return; }
      navigator.geolocation.getCurrentPosition(function (pos) {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        load();
      }, function () {
        alert('We could not get your location. Allow location access in your browser and try again.');
      });
    });

    load();
  </script>
  <script src="site-config.js"></script>
  <script src="site.js"></script>
  <script src="bot.js"></script>
</body>
</html>
